<div class="filters">
  <div class="filters__search">
    <img src="assets/icons/ic_search.svg" width="16" height="16" alt="" aria-hidden="true" />
    <input
      type="search"
      class="filters__input"
      placeholder="Search by name…"
      aria-label="Search Pokémon by name"
      [value]="text()"
      (input)="onSearchInput($event)"
    />
    @if (text()) {
      <button type="button" class="filters__clear" aria-label="Clear search" (click)="clearSearch()">
        <img src="assets/icons/ic_close.svg" width="14" height="14" alt="" aria-hidden="true" />
      </button>
    }
  </div>

  <label class="filters__type">
    <span class="filters__label">Type</span>
    <select aria-label="Filter by type" (change)="onTypeChange($event)">
      <option value="" [selected]="!typeFilter()">All types</option>
      @for (type of types; track type) {
        <option [value]="type" [selected]="type === typeFilter()">{{ type }}</option>
      }
    </select>
  </label>

  @if (viewMode() === 'cards') {
    <div class="filters__sort">
      <label class="filters__type">
        <span class="filters__label">Sort</span>
        <select aria-label="Sort Pokémon by" (change)="onSortSelect($event)">
          @for (option of sortOptions; track option.key) {
            <option [value]="option.key" [selected]="option.key === sortKey()">{{ option.label }}</option>
          }
        </select>
      </label>
      <button
        type="button"
        class="filters__dir"
        [attr.aria-label]="sortDirection() === 'asc' ? 'Sorted ascending, switch to descending' : 'Sorted descending, switch to ascending'"
        (click)="sortChange.emit(sortKey())"
      >
        <img [src]="sortDirection() === 'asc' ? 'assets/icons/ic_sort_asc.svg' : 'assets/icons/ic_sort_desc.svg'" width="16" height="16" alt="" aria-hidden="true" />
      </button>
    </div>
  }

  <div class="filters__toggle" role="group" aria-label="View mode">
    <button type="button" [class.active]="viewMode() === 'cards'" [attr.aria-pressed]="viewMode() === 'cards'" (click)="viewModeChange.emit('cards')">Cards</button>
    <button type="button" [class.active]="viewMode() === 'table'" [attr.aria-pressed]="viewMode() === 'table'" (click)="viewModeChange.emit('table')">Table</button>
  </div>
</div>
