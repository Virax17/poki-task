<div class="dock" role="search">
  <label class="dock__search">
    <img src="assets/icons/ic_search.svg" width="18" height="18" alt="" aria-hidden="true" />
    <input
      #search
      type="text"
      autocomplete="off"
      placeholder="Search Pokémon…"
      aria-label="Search Pokémon by name"
      [value]="text()"
      (input)="onSearchInput($event)"
    />
    @if (text()) {
      <button type="button" class="dock__clear" aria-label="Clear search" (click)="clearSearch()">
        <img src="assets/icons/ic_close.svg" width="14" height="14" alt="" aria-hidden="true" />
      </button>
    } @else {
      <kbd class="dock__hint" aria-hidden="true">/</kbd>
    }
  </label>

  @if (viewMode() === 'cards') {
    <div class="dock__sort">
      <select aria-label="Sort Pokémon by" (change)="onSortSelect($event)">
        @for (option of sortOptions; track option.key) {
          <option [value]="option.key" [selected]="option.key === sortKey()">{{ option.label }}</option>
        }
      </select>
      <button
        type="button"
        class="dock__icon-btn"
        [attr.aria-label]="sortDirection() === 'asc' ? 'Sorted ascending, switch to descending' : 'Sorted descending, switch to ascending'"
        (click)="sortChange.emit(sortKey())"
      >
        <img
          class="dock__dir"
          [class.dock__dir--desc]="sortDirection() === 'desc'"
          src="assets/icons/ic_sort_asc.svg"
          width="18"
          height="18"
          alt=""
          aria-hidden="true"
        />
      </button>
    </div>
  }

  <div class="dock__toggle" role="group" aria-label="View mode" [attr.data-mode]="viewMode()">
    <span class="dock__thumb" aria-hidden="true"></span>
    <button type="button" [attr.aria-pressed]="viewMode() === 'cards'" (click)="viewModeChange.emit('cards')">Cards</button>
    <button type="button" [attr.aria-pressed]="viewMode() === 'table'" (click)="viewModeChange.emit('table')">Table</button>
  </div>
</div>
