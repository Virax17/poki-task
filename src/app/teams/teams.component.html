<section class="teams">
  <app-page-banner
    theme="teams"
    eyebrow="Team builder"
    title="Assemble your dream team"
    subtitle="Pick up to six Pokémon, name your squad and see how strong it is."
    [decor]="['⭐', '🎒', '⚡', '🔥', '💧']"
  >
    @if (view(); as v) {
      <span class="teams__chip"><strong>{{ v.teams.length }}</strong> {{ v.teams.length === 1 ? 'team' : 'teams' }} saved</span>
    }
  </app-page-banner>

  <div class="teams__grid">
    <div class="teams__col">
      @if (view(); as v) {
        <app-team-list
          [view]="v"
          [selectedId]="selectedTeamId()"
          (selected)="onSelect($event)"
          (deleted)="onDelete($event)"
          (retry)="store.load()"
        />
      }
    </div>

    <div class="teams__col">
      <app-team-form />
      <app-team-summary [team]="selectedTeam()" />
    </div>
  </div>
</section>
